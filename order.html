<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css">
  <style>
    .order-actions {
      margin-top: var(--space-5);
      text-align: center;
    }
    .order-back {
      margin: var(--space-3) 0 0;
      font-size: 0.9rem;
      text-align: center;
    }
    .order-back a {
      color: var(--beige-dark);
      border-bottom: 1px solid var(--line);
    }
    .order-back a:hover {
      color: var(--ink);
      border-bottom-color: var(--accent);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container-narrow">
        <div class="section-head">
          <h1 class="page-title">สั่งซื้อสินค้า</h1>
          <span class="rule" aria-hidden="true"></span>
          <p class="lead">ตรวจสอบรายการและยอดรวม แล้วกรอกข้อมูลเพื่อยืนยันคำสั่งซื้อ</p>
        </div>

        <!-- script.js เติม #items และ #total จาก URL และจัดการการส่งข้อมูลเอง -->
        <form id="orderForm">
          <div class="field">
            <label for="items">รายการสินค้า</label>
            <textarea id="items" name="items" rows="2" required></textarea>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="number" id="total" name="total" min="0" step="1" inputmode="numeric" required>
          </div>

          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="off" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <div class="order-actions">
            <button type="submit" class="btn btn-solid">ยืนยันสั่งซื้อ</button>
          </div>
        </form>

        <p class="order-back"><a href="product.html">เลือกสินค้าเพิ่มเติม</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <p>&copy; 2026 Body Scent สงวนลิขสิทธิ์</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
